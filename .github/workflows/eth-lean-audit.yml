name: ETH Lean audit (openai/math result 378, read-only)

# Separate, read-only formal audit. Not part of any Yang-Mills branch or receipt.
# Dispatch only (no push trigger), so a push can never start a second, parallel chain.
# The verdict is read from the leg whose VERDICT line says COMPLETE, never from a badge.
on:
  workflow_dispatch:
    inputs:
      leg:
        description: 'build leg number (the workflow re-dispatches itself until the build is complete)'
        required: false
        default: '1'
      prev_run:
        description: 'run id of the previous leg (empty for leg 1)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: eth-lean-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: audits/eth-378
    env:
      LEG: ${{ github.event.inputs.leg || '1' }}
      PREV_RUN: ${{ github.event.inputs.prev_run || '' }}
      MAX_LEGS: '8'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify the audited sources (pinned commit, hashed tree)
        run: bash fetch_sources.sh | tee sources.hbp

      - name: Install elan and the pinned toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore partial build from earlier legs
        uses: actions/cache/restore@v4
        with:
          path: audits/eth-378/.lake/build
          key: eth378-build-${{ hashFiles('audits/eth-378/sources.hbp', 'audits/eth-378/lakefile.lean', 'audits/eth-378/lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: eth378-build-${{ hashFiles('audits/eth-378/sources.hbp', 'audits/eth-378/lakefile.lean', 'audits/eth-378/lake-manifest.json') }}-

      - name: Mathlib cache
        run: |
          lean --version | tee toolchain.txt
          lake exe cache get

      - name: Swap (leg 1 lost its runner at 2.5 h, consistent with memory exhaustion)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 24G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -m

      - name: Build (bounded; a timeout here is not completion)
        id: build
        run: |
          set +e
          start=$(date +%s)
          ( while true; do echo "MEM|t=$(( $(date +%s) - start ))|$(free -m | awk '/Mem:/{print "used_mb="$3"|avail_mb="$7} /Swap:/{print "|swap_used_mb="$3}' | tr -d '\n')|json=0"; sleep 300; done ) > mem.log &
          timeout 170m lake build OAI.Algorithms.SubexponentialSAT.Main ComparatorChallenges.SubexponentialSAT EthAudit.Bridge > build.log 2>&1
          rc=$?
          echo "BUILD_LEG|leg=$LEG|run=$GITHUB_RUN_ID|prev_run=$PREV_RUN|workflow_sha=$GITHUB_SHA|rc=$rc|seconds=$(( $(date +%s) - start ))|built=$(grep -c 'Built' build.log)|json=0" | tee build-leg.hbp
          grep -E '^(error|✖)' build.log | head -50 || true
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # fail closed: only 0 (complete) and 124 (bounded timeout, next leg) are not failures
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "FORMAL_BUILD|FAIL|rc=$rc|json=0" | tee -a build-leg.hbp
            exit "$rc"
          fi

      - name: Save partial build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: audits/eth-378/.lake/build
          key: eth378-build-${{ hashFiles('audits/eth-378/sources.hbp', 'audits/eth-378/lakefile.lean', 'audits/eth-378/lake-manifest.json') }}-${{ github.run_id }}

      - name: Next leg if the build timed out
        if: steps.build.outputs.rc == '124'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$LEG" -ge "$MAX_LEGS" ]; then echo "BUILD_LEGS_EXHAUSTED|leg=$LEG|json=0"; exit 1; fi
          gh workflow run eth-lean-audit.yml --ref "$GITHUB_REF_NAME" -f leg=$(( LEG + 1 )) -f prev_run="$GITHUB_RUN_ID"
          echo "BUILD_CONTINUES|next_leg=$(( LEG + 1 ))|json=0"

      - name: Kernel check, statement tie and axiom closure
        id: check
        if: steps.build.outputs.rc == '0'
        run: |
          set -o pipefail
          lake env lean EthAudit/Check.lean 2>&1 | tee axioms.txt
          # exactly the four expected lines, each within the permitted set, nothing else
          python3 - <<'PY'
          import re, sys
          want = ["OAI.Algorithms.SubexponentialSAT.SqrtLogSpace.exact_count_and_sat",
                  "EthAudit.statement_is_solution", "EthAudit.eth_refuted_3sat",
                  "EthAudit.halted_of_answer"]
          ok_ax = {"propext", "Quot.sound", "Classical.choice"}
          lines = [l for l in open("axioms.txt").read().splitlines() if l.strip()]
          got = {}
          bad = []
          for l in lines:
              m = re.fullmatch(r"'(\S+)' depends on axioms: \[(.*)\]", l.strip())
              if m:
                  got[m.group(1)] = {a.strip() for a in m.group(2).split(",") if a.strip()}
              else:
                  bad.append(l)
          ok = (not bad) and sorted(got) == sorted(want) and all(v <= ok_ax for v in got.values())
          for k in want:
              print("AXIOMS|%s|%s|json=0" % (k, ",".join(sorted(got.get(k, {"MISSING"})))))
          print("AXIOM_CLOSURE|%s|json=0" % ("EXPECTED" if ok else "UNEXPECTED"))
          sys.exit(0 if ok else 1)
          PY

      - name: Comparator (statement equality + permitted axioms, sandboxed)
        id: comparator
        if: steps.build.outputs.rc == '0' && steps.check.outcome == 'success'
        run: |
          set -o pipefail
          tc=$(cat lean-toolchain)
          for r in comparator lean4export; do
            git clone -q --depth 1 -b v4.34.0 https://github.com/leanprover/$r /tmp/$r
            (cd /tmp/$r && echo "$tc" > lean-toolchain && lake build)
          done
          GOBIN=/tmp/gobin go install github.com/zouuup/landrun/cmd/landrun@ec104f6edc1e
          export PATH=/tmp/lean4export/.lake/build/bin:/tmp/gobin:$PATH
          lake env /tmp/comparator/.lake/build/bin/comparator comparator.json 2>&1 | tee comparator.txt

      - name: Verdict (fail-closed conjunction)
        if: always()
        run: |
          b='${{ steps.build.outputs.rc }}'; c='${{ steps.check.outcome }}'; k='${{ steps.comparator.outcome }}'
          if [ "$b" = "0" ] && [ "$c" = "success" ] && [ "$k" = "success" ]; then v=COMPLETE
          elif [ "$b" = "124" ]; then v=CONTINUES
          else v=NOT_CERTIFIED; fi
          echo "VERDICT|leg=$LEG|run=$GITHUB_RUN_ID|prev_run=$PREV_RUN|build_rc=${b:-none}|check=${c:-skipped}|comparator=${k:-skipped}|status=$v|json=0" | tee verdict.hbp
          [ "$v" != NOT_CERTIFIED ]

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth378-leg-${{ env.LEG }}
          path: |
            audits/eth-378/sources.hbp
            audits/eth-378/toolchain.txt
            audits/eth-378/build-leg.hbp
            audits/eth-378/build.log
            audits/eth-378/axioms.txt
            audits/eth-378/comparator.txt
            audits/eth-378/verdict.hbp
            audits/eth-378/mem.log
          if-no-files-found: ignore
